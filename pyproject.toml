[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessbox"
version = "0.4.0"
description = "Самостоятельная верификация EBT: гейт, чекер и SDK"
readme = "docs/usage.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ebt-gate = "ebt_verification.cli:main"
ebt-check = "ebt_verification.checker.ebt_check:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["checkers", "ebt_check"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebt_verification = ["gate.sh", "runners/*.sh"]
"ebt_verification.checker" = ["fixtures/*.jsonl"]
"ebt_verification.resources" = [
  "lib/ebt/Ebt.java",
  "lib/ebt/ebt.dart",
  "lib/ebt/ebt.ts",
  "scaffold/*.md",
  "scaffold/*.toml",
  "scaffold/*.py",
  "scaffold/*/*.sh",
  "scaffold/*/*.txt",
]

[tool.setuptools.exclude-package-data]
# Тестовые модули runtime не поставляются. Заготовка — данные, а не runtime:
# её test_checks.py должен попасть в wheel, поэтому исключение задано по пакетам,
# а не шаблоном "*".
"ebt_verification" = ["test_*.py"]
"ebt_verification.checker" = ["test_*.py"]
