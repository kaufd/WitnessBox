[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessbox"
version = "0.5.2"
# Продуктовое описание для метаданных пакета: постановка задачи задаёт его на английском.
description = "Independent verification of agent-written code through test evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["testing", "verification", "evidence", "coding-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/kaufd/WitnessBox"
Documentation = "https://github.com/kaufd/WitnessBox/blob/main/docs/usage.md"
Source = "https://github.com/kaufd/WitnessBox"
Issues = "https://github.com/kaufd/WitnessBox/issues"

[project.scripts]
ebt-gate = "witnessbox.cli:main"
ebt-check = "witnessbox.checker.ebt_check:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["checkers", "ebt_check"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witnessbox = ["gate.sh", "runners/*.sh"]
"witnessbox.checker" = ["fixtures/*.jsonl"]
"witnessbox.resources" = [
  "lib/ebt/Ebt.java",
  "lib/ebt/ebt.dart",
  "lib/ebt/ebt.ts",
  "scaffold/*.md",
  "scaffold/*.toml",
  "scaffold/*.py",
  "scaffold/*/*.sh",
  "scaffold/*/*.txt",
]

[tool.setuptools.exclude-package-data]
# Тестовые модули runtime не поставляются. Заготовка — данные, а не runtime:
# её test_checks.py должен попасть в wheel, поэтому исключение задано по пакетам,
# а не шаблоном "*".
witnessbox = ["test_*.py"]
"witnessbox.checker" = ["test_*.py"]
