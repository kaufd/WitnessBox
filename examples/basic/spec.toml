# ebt/spec.toml: registry of requirements and invariants (EBT level 2).
#
# This is a SPEC, not code. It is written from the requirements before implementation
# (an analyst / QA / a second agent), and a human approves it.
# The agent that writes the application code does NOT change this file:
# protect the path through CODEOWNERS (see README).
#
# Each invariant defines:
#   req         — which requirement it formalizes;
#   statement   — wording for a human and an AI reviewer;
#   checker     — an independent checker in src/witnessbox/checker/checkers.py;
#   witness     — fields without which the evidence cannot be re-verified;
#   partitions  — input partitions, each of which must occur
#                 in the run (otherwise the invariant is "not proven" on that partition).

[meta]
version = "2026-10-28"

# ── Cart ───────────────────────────────────────────────────────────

[req.REQ-CART-1]
text = """Cart total = sum of (price × quantity) over the lines minus the discount. \
Money is whole minor units. A percent discount is rounded down to the minor unit. \
A fixed discount is not greater than the sum of the lines. The total is never negative."""

[inv.INV-CART-3]
req = "REQ-CART-1"
statement = "result == subtotal − off, where subtotal = Σ price·qty, off is computed by the discount rule from REQ-CART-1"
checker = "cart_total"
witness = ["lines", "discount", "subtotal", "off", "result"]
partitions = [
  "empty_cart",
  "no_discount",
  "percent",
  "percent_rounding",
  "fixed",
  "fixed_exceeds_subtotal",
]

# ── Checkout: state machine ───────────────────────────────

[req.REQ-CHECKOUT-2]
text = """Only a confirmed cart can be paid for. After payment starts \
the cart cannot be edited. A failed payment returns to the confirmed cart."""

[inv.SM-CHECKOUT]
req = "REQ-CHECKOUT-2"
statement = "Every transition (from, event, to) is in the transition table; all table transitions occur in the run"
checker = "transition"
witness = ["from", "event", "to"]
# Coverage partitions are derived automatically: one per transition.
transitions = [
  ["cart",      "confirm", "confirmed"],
  ["confirmed", "edit",    "cart"],
  ["confirmed", "pay",     "paying"],
  ["paying",    "paid",    "done"],
  ["paying",    "failed",  "confirmed"],
]

# ── Offline sync ──────────────────────────────────────────────

[req.REQ-SYNC-1]
text = """When merging local and server records by id, the greater version wins, \
on equal versions the server one. Deleted records (tombstones) do not get into the result. \
There are no duplicate ids in the result."""

[inv.INV-SYNC-1]
req = "REQ-SYNC-1"
statement = "out matches the result of merging local and remote by the rule REQ-SYNC-1"
checker = "sync_merge"
witness = ["local", "remote", "out"]
partitions = [
  "local_only",
  "remote_only",
  "conflict_local_wins",
  "conflict_remote_wins",
  "conflict_tie",
  "tombstone",
]

# ── A requirement without invariants (to demonstrate the coverage report) ─────

[req.REQ-PROFILE-1]
text = "The user name in the profile is truncated to 64 characters without splitting surrogate pairs."
