# ebt/spec.toml — реестр требований и инвариантов (уровень 2 EBT).
#
# Это СПЕЦИФИКАЦИЯ, а не код. Её пишут из требований до реализации
# (аналитик / QA / второй агент), и её утверждает человек.
# Агент, который пишет код приложения, этот файл НЕ меняет:
# защитите путь через CODEOWNERS (см. README).
#
# Каждый инвариант задаёт:
#   req         — какое требование он формализует;
#   statement   — формулировка для человека и ИИ-ревьюера;
#   checker     — независимый чекер в src/witnessbox/checker/checkers.py;
#   witness     — поля, без которых свидетельство нельзя перепроверить;
#   partitions  — классы входов, каждый из которых должен встретиться
#                 в прогоне (иначе инвариант «не доказан» на этом классе).

[meta]
version = "2026-10-28"

# ── Корзина ───────────────────────────────────────────────────────────

[req.REQ-CART-1]
text = """Итог корзины = сумма (цена × количество) по позициям минус скидка. \
Деньги — целые копейки. Процентная скидка округляется вниз до копейки. \
Фиксированная скидка не больше суммы позиций. Итог не бывает отрицательным."""

[inv.INV-CART-3]
req = "REQ-CART-1"
statement = "result == subtotal − off, где subtotal = Σ price·qty, off считается по правилу скидки из REQ-CART-1"
checker = "cart_total"
witness = ["lines", "discount", "subtotal", "off", "result"]
partitions = [
  "empty_cart",
  "no_discount",
  "percent",
  "percent_rounding",
  "fixed",
  "fixed_exceeds_subtotal",
]

# ── Оформление заказа: машина состояний ───────────────────────────────

[req.REQ-CHECKOUT-2]
text = """Оплатить можно только подтверждённую корзину. После начала оплаты \
корзину нельзя редактировать. Неуспешная оплата возвращает к подтверждённой корзине."""

[inv.SM-CHECKOUT]
req = "REQ-CHECKOUT-2"
statement = "Каждый переход (from, event, to) есть в таблице переходов; все переходы таблицы встречаются в прогоне"
checker = "transition"
witness = ["from", "event", "to"]
# Классы покрытия выводятся автоматически: по одному на каждый переход.
transitions = [
  ["cart",      "confirm", "confirmed"],
  ["confirmed", "edit",    "cart"],
  ["confirmed", "pay",     "paying"],
  ["paying",    "paid",    "done"],
  ["paying",    "failed",  "confirmed"],
]

# ── Офлайн-синхронизация ──────────────────────────────────────────────

[req.REQ-SYNC-1]
text = """При слиянии локальных и серверных записей по id побеждает большая версия, \
при равных версиях — серверная. Удалённые записи (tombstone) в результат не попадают. \
Дублей по id в результате нет."""

[inv.INV-SYNC-1]
req = "REQ-SYNC-1"
statement = "out совпадает с результатом слияния local и remote по правилу REQ-SYNC-1"
checker = "sync_merge"
witness = ["local", "remote", "out"]
partitions = [
  "local_only",
  "remote_only",
  "conflict_local_wins",
  "conflict_remote_wins",
  "conflict_tie",
  "tombstone",
]

# ── Требование без инвариантов (для демонстрации отчёта покрытия) ─────

[req.REQ-PROFILE-1]
text = "Имя пользователя в профиле обрезается до 64 символов без разрыва суррогатных пар."
