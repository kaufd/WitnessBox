# ebt/spec.toml: registry of the project requirements and invariants (EBT, decision level).
#
# This is a spec, not code. An analyst writes it from the ticket, owner decisions and the reference
# before the code, and a human approves it (decision D4). The agent that writes the application code
# does not change this file. The scaffold below is an example to replace: the EXAMPLE identifiers and the rule
# `example_rule` must not end up in the approved product spec.
#
# [req.<ID>]: requirement:
#   text   — what must be true, in domain terms;
#   source — where it comes from: ticket, decision <date>, <reference>: path:line.
#
# [inv.<ID>]: checkable formulation of the requirement:
#   req        — which REQ the invariant formalizes;
#   statement  — one phrase for a human;
#   checker    — name in CHECKERS from ebt/checks.py or a core checker
#                (cart_total, transition, sync_merge);
#   witness    — data fields without which the result cannot be recomputed;
#   partitions — input partitions, each of which must occur in the run.
#
# For a state machine, instead of partitions set checker = "transition" and
# transitions = [[from, event, to], ...]; one coverage partition is derived per transition.
#
# For a requirement with a visible or persisted outcome, add a twin <INV>-OBS with the same
# checker and witness but its own partitions: its records are made by the observation test (D29).
#
# The rule is verified independently: checks.py does not import the application or SDK and does not look
# at the ok field. The spec maintenance cost is lower if the witness is the minimal set
# of inputs and outputs, and partitions are the real boundaries from the requirement, not a list of tests.

[meta]
version = "YYYY-MM-DD"  # replace with the date a human approved the spec

# ── Example: replace with an approved requirement ───────────────────────

[req.REQ-EXAMPLE-1]
text = """The result is twice the value: result = value × 2. This is a template example,
not a product requirement: replace the text, ID and source with an approved requirement."""
source = """ticket: <number and quote>; decision <date>: <quote>"""

[inv.INV-EXAMPLE-1]
req = "REQ-EXAMPLE-1"
statement = "result == value × 2"
checker = "example_rule"
witness = ["value", "result"]
# Input partitions that must occur in the evidence. A rule violation is
# not a coverage partition: test_checks.py checks it, and evidence with it yields a finding.
partitions = ["zero", "positive", "negative"]

