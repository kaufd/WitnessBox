name: Witnessbox setup
description: Installs witnessbox and verifies the wheel and --installation against release.json

inputs:
  version:
    description: witnessbox version in X.Y.Z format
    required: true

outputs:
  installation:
    description: Path to the JSON printed by the witnessbox --installation command
    value: ${{ steps.install.outputs.installation }}

runs:
  using: composite
  steps:
    - name: Check the version format
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "version: expected X.Y.Z, got '$VERSION'" >&2
          exit 2
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Download release.json
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/witnessbox"
        gh release download "v$VERSION" --repo kaufd/witnessbox \
          --pattern release.json --dir "$RUNNER_TEMP/witnessbox" --clobber

    - name: Download the wheel from PyPI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python -I -m pip download --disable-pip-version-check \
          --no-deps --only-binary=:all: \
          --dest "$RUNNER_TEMP/witnessbox" "witnessbox==$VERSION"

    - name: Verify the wheel against release.json
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        wheel=""
        for candidate in "$RUNNER_TEMP/witnessbox"/witnessbox-"$VERSION"-*.whl; do
          [ -e "$candidate" ] || continue
          if [ -n "$wheel" ]; then
            echo "wheel: expected one file witnessbox-$VERSION-*.whl, found several: $wheel, $candidate" >&2
            exit 2
          fi
          wheel=$candidate
        done
        [ -n "$wheel" ] || {
          echo "wheel: witnessbox-$VERSION-*.whl not found" >&2
          exit 2
        }
        python -I "$GITHUB_ACTION_PATH/verify_release.py" wheel \
          "$RUNNER_TEMP/witnessbox/release.json" "$wheel"
        echo "WHEEL=$wheel" >> "$GITHUB_ENV"

    - name: Install the verified wheel and verify --installation
      id: install
      shell: bash
      run: |
        set -euo pipefail
        uv tool install --force "$WHEEL"
        tool_bin="$(uv tool dir --bin)"
        echo "$tool_bin" >> "$GITHUB_PATH"
        export PATH="$tool_bin:$PATH"
        witnessbox --version >/dev/null
        witnessbox check --version >/dev/null
        witnessbox --installation > "$RUNNER_TEMP/witnessbox/installation.json"
        python -I "$GITHUB_ACTION_PATH/verify_release.py" installation \
          "$RUNNER_TEMP/witnessbox/release.json" "$RUNNER_TEMP/witnessbox/installation.json"
        echo "installation=$RUNNER_TEMP/witnessbox/installation.json" >> "$GITHUB_OUTPUT"
