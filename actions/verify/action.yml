name: Witnessbox verify
description: Re-verifies the evidence from workflow_run, signs gate.json and sets a commit status

inputs:
  github-token:
    description: Token with actions:read and statuses:write permissions (github.token by default)
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set the pending status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ -z "$HEAD_SHA" ]; then
          echo "workflow_run has no head_sha" >&2
          exit 1
        fi
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state=pending -f context=witnessbox/gate \
          -f description="evidence re-verification" -f target_url="$TARGET_URL" >/dev/null

    - name: Check the event and BASE
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" != "workflow_run" ]; then
          echo "EBT_VERIFY_ERROR=actions/verify runs only in a job on workflow_run" >> "$GITHUB_ENV"
          exit 1
        fi
        if [ -z "${BASE_SHA:-}" ]; then
          echo "EBT_VERIFY_ERROR=no BASE: a PR from a fork or a push without a PR is not supported" >> "$GITHUB_ENV"
          exit 1
        fi
        if [ "${HEAD_REPOSITORY:-}" != "$GITHUB_REPOSITORY" ]; then
          echo "EBT_VERIFY_ERROR=a PR from a fork is not supported: head_repository=$HEAD_REPOSITORY" >> "$GITHUB_ENV"
          exit 1
        fi
        echo "BASE=$BASE_SHA" >> "$GITHUB_ENV"

    - name: Check that actions/setup has run
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v witnessbox >/dev/null 2>&1; then
          echo "EBT_VERIFY_ERROR=witnessbox not found on PATH: run actions/setup first" >> "$GITHUB_ENV"
          exit 1
        fi

    - name: Check out the PR commit
      # actions/checkout allows path only inside GITHUB_WORKSPACE; RUNNER_TEMP is
      # not available here. The clone is not executed anyway: prepare.sh reads it only through git/tar.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
        path: clone

    - name: Download the first-stage evidence
      id: evidence
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: witnessbox-evidence
        path: ${{ runner.temp }}/evidence
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token }}

    - name: Check that the artifact exists
      if: steps.evidence.outcome != 'success'
      shell: bash
      run: |
        echo "EBT_VERIFY_ERROR=no witnessbox-evidence artifact" >> "$GITHUB_ENV"
        exit 1

    - name: Prepare ebt/ from BASE
      shell: bash
      run: |
        set -euo pipefail
        if output=$("$GITHUB_ACTION_PATH/prepare.sh" "$GITHUB_WORKSPACE/clone" \
                     "$BASE" "$RUNNER_TEMP/ebt" 2>&1); then
          printf '%s\n' "$output"
        else
          rc=$?
          printf '%s\n' "$output" >&2
          message=$(printf '%s' "$output" | tr '\n' ' ')
          echo "EBT_VERIFY_ERROR=$message" >> "$GITHUB_ENV"
          exit "$rc"
        fi

    - name: Re-verify the evidence with the trusted gate
      id: gate
      shell: bash
      env:
        EBT_REPLAY_DIR: ${{ runner.temp }}/evidence
        PYTHONPATH: ""
        PYTHONHOME: ""
      run: |
        set -euo pipefail
        run="$RUNNER_TEMP/run"
        rm -rf "$run"
        mkdir -p "$run"
        set +e
        BASE="$BASE" EBT_RUNNER=test.sh EBT_CHECK= EBT_REPLAY_DIR="$EBT_REPLAY_DIR" \
          witnessbox gate "$RUNNER_TEMP/ebt" "$GITHUB_WORKSPACE/clone" "$run"
        rc=$?
        set -e
        echo "EBT_VERIFY_RC=$rc" >> "$GITHUB_ENV"
        echo "EBT_GATE_RUN=$run" >> "$GITHUB_ENV"
        if [ -f "$run/gate.json" ]; then
          echo "gate_json=true" >> "$GITHUB_OUTPUT"
        else
          echo "gate_json=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Publish gate.md to the summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "$RUNNER_TEMP/run/gate.md" ]; then
          cat "$RUNNER_TEMP/run/gate.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Sign gate.json with a GitHub attestation
      id: attest
      if: steps.gate.outputs.gate_json == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/run/gate.json

    - name: Upload the second-stage verdict
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: witnessbox-verdict
        path: ${{ runner.temp }}/run
        if-no-files-found: warn

    - name: Set the final commit status
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ATTEST_OUTCOME: ${{ steps.attest.outcome }}
      run: |
        set -u
        if [ -z "${HEAD_SHA:-}" ]; then
          echo "no head_sha: the final status was not set" >&2
          exit 1
        fi
        rc=${EBT_VERIFY_RC:-2}
        gate_json="$RUNNER_TEMP/run/gate.json"
        if [ -f "$gate_json" ]; then
          case $rc in
            0) state=success ;;
            1) state=failure ;;
            *) state=error ;;
          esac
        else
          state=error
          rc=2
        fi
        # PASS without a signature gives no D45 guarantee: only a signed verdict counts as success.
        if [ "$state" = success ] && [ "${ATTEST_OUTCOME:-}" != success ]; then
          state=error
          rc=2
        fi
        description=$(python3 -I - "$gate_json" <<'PY'
        import json
        import os
        import sys

        fallback = os.environ.get("EBT_VERIFY_ERROR") or "re-verification not performed"
        try:
            with open(sys.argv[1], encoding="utf-8") as stream:
                summary = json.load(stream)
        except (OSError, UnicodeError, ValueError):
            text = fallback
        else:
            result = summary.get("result") if isinstance(summary, dict) else None
            reasons = summary.get("reasons") if isinstance(summary, dict) else None
            message = summary.get("message") if isinstance(summary, dict) else None
            parts = [str(result or "ERROR")]
            if reasons:
                parts.append(", ".join(str(reason) for reason in reasons))
            if message:
                parts.append(str(message))
            text = " · ".join(parts).replace("\n", " ")
        print(text[:140])
        PY
        ) || description="re-verification not performed"
        [ -n "$description" ] || description="re-verification not performed"
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state="$state" -f context=witnessbox/gate \
          -f description="$description" -f target_url="$TARGET_URL" >/dev/null
        echo "witnessbox/gate: $state — $description"
        # Any gate outcome is already reflected in the status; the job is not failed because of FAIL,
        # but an error before the gate must remain visible.
        [ "$rc" -ne 2 ] || exit 1
