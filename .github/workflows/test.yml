# Тесты репозитория на каждый PR: чекер, установленный wheel-гейт, пример и SDK.
# Workflow ничего не собирает для выпуска и ничего не публикует: в индексы попадают
# только файлы из GitHub Release, проверенные `make release-check` (D40).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Настроить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Настроить uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Тесты чекера, гейта и примера
        run: make test example PY=python
      - name: Пример детерминирован
        run: git diff --exit-code examples/

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Настроить Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Настроить Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Настроить Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Тесты SDK
        run: make test-sdk

  e2e:
    name: e2e ${{ matrix.stack }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ts, generic, jvm]
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Настроить uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Собрать и установить wheel
        run: |
          uv build
          uv tool install --force dist/witnessbox-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Настроить Bun
        if: matrix.stack != 'jvm'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Настроить Java 17
        if: matrix.stack == 'jvm'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Настроить Gradle
        if: matrix.stack == 'jvm'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Сквозной пример
        run: make e2e STACK=${{ matrix.stack }}
