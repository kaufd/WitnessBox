# Repository tests on every PR: the checker, the installed wheel gate, the example and the SDKs.
# The workflow builds nothing for release and publishes nothing: the indexes get
# only the files from the GitHub Release verified by `make release-check` (D40).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Checker, gate and example tests
        run: make test example PY=python
      - name: The example is deterministic
        run: git diff --exit-code examples/

  # The same tests as `python`, on Windows under WSL 2 (D60). Native Windows is not supported.
  # The Windows checkout is only the source of a clone: the tests run in a clean clone of HEAD on the
  # Linux file system as an ordinary user, as `make test-linux` does, so line endings and file modes
  # are those of the repository, not of the Windows checkout.
  wsl:
    name: Python on Windows (WSL 2, Ubuntu 24.04)
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Temporary diagnostics: setup-wsl failed twice with `getaddrinfo EAI_AGAIN releases.ubuntu.com`.
      # Shows how the runner resolves the host compared with public resolvers; remove once settled.
      - name: Diagnose DNS for releases.ubuntu.com
        shell: pwsh
        continue-on-error: true
        run: |
          Get-DnsClientServerAddress -AddressFamily IPv4 | Where-Object ServerAddresses | Format-Table -AutoSize
          foreach ($name in 'releases.ubuntu.com', 'archive.ubuntu.com', 'salsa.debian.org', 'github.com') {
            foreach ($server in $null, '8.8.8.8', '1.1.1.1') {
              $label = if ($server) { $server } else { 'runner' }
              try {
                $params = @{ Name = $name; Type = 'A'; DnsOnly = $true; QuickTimeout = $true; ErrorAction = 'Stop' }
                if ($server) { $params.Server = $server }
                $ips = (Resolve-DnsName @params | Where-Object IPAddress).IPAddress -join ', '
                "$name via ${label}: $ips"
              } catch {
                "$name via ${label}: FAILED $($_.Exception.Message)"
              }
            }
          }
          try {
            $r = Invoke-WebRequest -Method Head -Uri 'https://releases.ubuntu.com/24.04.5/ubuntu-24.04.5-wsl-amd64.wsl' -TimeoutSec 30
            "HEAD releases.ubuntu.com image: $($r.StatusCode)"
          } catch {
            "HEAD releases.ubuntu.com image: FAILED $($_.Exception.Message)"
          }
      - name: Set up WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          additional-packages: git make perl python3 python3-venv
      - name: Checker, gate and example tests; the example is deterministic
        run: |
          set -e
          useradd -m t
          runuser -l t -c "set -e
            git -c safe.directory='*' clone -q '$PWD' ~/repo
            python3 -m venv ~/uv
            ~/uv/bin/pip install -q uv==0.11.28
            mkdir ~/bin && ln -s ~/uv/bin/uv ~/bin/uv
            export PATH=~/bin:\$PATH
            cd ~/repo
            make test example PY=python3
            git diff --exit-code examples/"

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: SDK tests and dart format for ebt.dart
        run: make test-sdk

  e2e:
    name: e2e ${{ matrix.stack }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [ts, generic, jvm, dart]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build and install the wheel
        run: |
          uv build
          uv tool install --force dist/witnessbox-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Set up Bun
        if: matrix.stack == 'ts' || matrix.stack == 'generic'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Java 17
        if: matrix.stack == 'jvm'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: matrix.stack == 'jvm'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Set up Flutter
        if: matrix.stack == 'dart'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.41.9"
      - name: End-to-end example
        run: make e2e STACK=${{ matrix.stack }}
