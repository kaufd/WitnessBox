<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Witnessbox verification flow</title>
<desc>The gate checks the checkout and runs the project's test.sh; witnessbox check recomputes the evidence against the check inputs; the result is PASS, FAIL or ERROR with reports for CI and for a human.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="740" fill="#FFFFFF"/>
<rect x="40" y="40" width="310" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="195.0" y="58.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">1. Checkout verification</text>
<text x="195.0" y="78.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">clean tree, ebt/ and copies intact</text>
<rect x="40" y="136" width="310" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="195.0" y="154.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">2. Project tests: test.sh</text>
<text x="195.0" y="174.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">write evidence to OUT_DIR</text>
<rect x="40" y="232" width="310" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="195.0" y="250.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Evidence JSONL</text>
<text x="195.0" y="270.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">seq, scope, req, inv, ok, data</text>
<rect x="40" y="328" width="310" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="195.0" y="346.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">3. witnessbox check: recomputation</text>
<text x="195.0" y="366.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">from data, not the code's ok</text>
<rect x="40" y="424" width="310" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="195.0" y="442.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">4. Gate result</text>
<text x="195.0" y="462.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">findings, test code, step 1 checks</text>
<path d="M195.0 98 L195.0 134" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M195.0 194 L195.0 230" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M195.0 290 L195.0 326" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M195.0 386 L195.0 422" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="390" y="136" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="515.0" y="154.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Project code + SDK</text>
<text x="515.0" y="174.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">ev() writes a record in tests</text>
<path d="M388 164 L354 164" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="390" y="300" width="250" height="112" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="515.0" y="326.0" fill="#633806" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Check inputs</text>
<text x="515.0" y="346.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">spec.toml — approved by a human</text>
<text x="515.0" y="366.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">known, baseline — accepted</text>
<text x="515.0" y="386.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">checks.py — project rules</text>
<path d="M388 356 L354 356" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="524" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="130.0" y="542.0" fill="#27500A" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">PASS · 0</text>
<text x="130.0" y="562.0" fill="#3B6D11" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">no findings</text>
<path d="M195.0 482 L130 522" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M130 582 L130 618" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="250" y="524" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="340.0" y="542.0" fill="#791F1F" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">FAIL · 1</text>
<text x="340.0" y="562.0" fill="#A32D2D" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">finding or failed test</text>
<path d="M195.0 482 L340 522" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M340 582 L340 618" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="460" y="524" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="550.0" y="542.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">ERROR · 2</text>
<text x="550.0" y="562.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">check did not run</text>
<path d="M195.0 482 L550 522" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M550 582 L550 618" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="620" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340.0" y="638.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">gate.json and report.json — for CI</text>
<text x="340.0" y="658.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">gate.md and report.md — for humans</text>
<rect x="40" y="704" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="62" y="711" fill="#5F5E5A" font-size="12" dominant-baseline="central">gate: deterministic</text>
<rect x="240" y="704" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="262" y="711" fill="#5F5E5A" font-size="12" dominant-baseline="central">project code</text>
<rect x="440" y="704" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="462" y="711" fill="#5F5E5A" font-size="12" dominant-baseline="central">check inputs</text>
</svg>
